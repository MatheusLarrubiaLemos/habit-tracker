
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Habit Tracker — App Local</title>
  <link rel="stylesheet" href="habit-tracker.css">
</head>
<body>
  <div class="app">
    <!-- Header: título e controles globais
         - `#monthYear` mostra o mês e ano atuais
         - `#darkToggle` alterna modo claro/escuro
         - `#optionsBtn` é o botão camuflado que abre o painel de export/import
    -->
    <header>
      <div>
        <h1>Habit Tracker</h1>
        <!-- Mostra: "Maio 2026" por exemplo, atualizado via JS -->
        <div id="monthYear" style="font-size:13px;color:#6b7280;margin-top:4px">--</div>
      </div>
      <div class="top-right">
        <button id="darkToggle" class="ghost" title="Alternar modo claro/escuro">Modo Claro/Escuro</button>
        <!-- botão discreto; abre painel com export/import sem poluir a UI principal -->
        <button id="optionsBtn" class="camouBtn" title="Opções">⚙</button>
      </div>
    </header>

    <!--
      Tabs (meses): container vazio preenchido por JavaScript.
      O script cria 12 botões (Jan..Dez) e aplica a classe `active` no mês escolhido.
    -->
    <div class="tabs" id="tabs"></div>

    <!--
      Controles principais:
      - Seletor de cor (`#colorPicker`) define a cor usada ao marcar células.
      - Campo `#habitNameInput` + `#addHabitBtn` adicionam um novo hábito.
    -->
    <div class="controls">
      <div class="color">
        <label for="colorPicker">Cor:</label>
        <!-- input type=color oferece seletor RGB/HEX no browser -->
        <input type="color" id="colorPicker" title="Escolha a cor das marcações">
        <span id="colorValue" style="font-size:13px;color:#374151"></span>
      </div>

      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <!-- Inserção de novo hábito -->
        <input id="habitNameInput" type="text" placeholder="Nome do hábito">
        <button id="addHabitBtn">Adicionar</button>
      </div>
    </div>

    <!--
      Tabela principal (habitTable):
      - As colunas representam os dias do mês (1..N) calculados em JS.
      - As linhas representam os hábitos cadastrados.
      - Cada célula é clicável e armazenará uma marcação no `state`.
      - A coluna final contém o botão "Remover" para excluir o hábito.
    -->
    <div class="table-wrap">
      <table id="habitTable">
        <!-- Cabeçalho e linhas são gerados via JavaScript -->
      </table>
    </div>

    <!--
      Painel de opções (camuflado):
      - `#exportBtn` baixa um arquivo JSON com o estado atual.
      - `#importFileInput` permite selecionar um arquivo JSON para importar.
      - Por segurança, a importação solicita confirmação e substitui os dados existentes.
      - O painel é exibido/ocultado pelo botão `#optionsBtn` (ícone ⚙).
    -->
    <div id="optionsPanel" class="optionsPanel" aria-hidden="true">
      <button id="exportBtn" class="ghost">Exportar JSON</button>
      <label style="font-size:13px;color:#374151">Importar JSON:</label>
      <input id="importFileInput" type="file" accept="application/json">
      <div style="font-size:12px;color:#6b7280;margin-top:6px">Importar substitui os dados atuais.</div>
    </div>

    <!-- Footer com resumo simples -->
    <div class="footer">
      <div id="summary">--</div>
      <div style="font-size:13px;color:#6b7280">Salvo localmente no navegador</div>
    </div>
  </div>

    <!-- Script principal (separado): contém toda a lógica da app.
      Observação de aprendizado: separar JS/CSS do HTML melhora organização
      e facilita entender cada camada (estrutura, apresentação, comportamento).
    -->
    <script src="habit-tracker.js" defer></script>
</body>
</html>
