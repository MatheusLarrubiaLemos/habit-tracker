# Gera o APK de teste (debug) do Android.
# Para baixar: aba "Actions" do GitHub → "Android (APK)" → último build verde → "Artifacts" → HabitTracker-apk.
name: Android (APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app (www) para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK com a versão
        id: nome
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "HabitTracker-$VERSAO.apk"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-apk
          path: HabitTracker-*.apk
          retention-days: 30
