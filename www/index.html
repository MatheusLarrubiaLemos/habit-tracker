<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit Tracker — App Local</title>
  <link rel="stylesheet" href="habit-tracker.css">
</head>
<body>
  <div class="app">
    <!-- ==================== CABEÇALHO ==================== -->
    <header>
      <!-- Lado esquerdo: título e navegação de anos -->
      <div>
        <h1>📅 Habit Tracker</h1>
        <div class="year-nav">
          <button id="prevYearBtn" class="year-btn" title="Ano anterior">«</button>
          <span id="currentYear" class="current-year"></span>
          <button id="nextYearBtn" class="year-btn" title="Próximo ano">»</button>
        </div>
        <div id="monthYear" class="month-year-display">--</div>
      </div>

      <!-- Lado direito: botões de tema e configurações -->
      <div class="top-right">
        <button id="darkToggle" class="icon-btn" title="Alternar modo claro/escuro">🌙</button>
        <button id="optionsBtn" class="icon-btn" title="Configurações">⚙️</button>
      </div>
    </header>

    <!-- ==================== ABAS DOS MESES ==================== -->
    <!-- As abas serão preenchidas dinamicamente pelo JavaScript -->
    <div class="tabs" id="tabs"></div>

    <!-- ==================== CONTROLES PRINCIPAIS ==================== -->
    <div class="controls">
      <!-- Seletor de cores compacto (botão + preview) -->
      <div class="color-selector">
        <button id="colorPickerBtn" class="icon-btn" title="Escolher cor do hábito">🎨</button>
        <input type="color" id="colorPicker" style="display: none;">
        <span id="colorPreview" class="color-preview"></span>
      </div>

      <!-- Adicionar novo hábito -->
      <div class="add-habit">
        <input id="habitNameInput" type="text" placeholder="Nome do hábito">
        <button id="addHabitBtn">Adicionar</button>
      </div>
    </div>
    
    <!-- ==================== TABELA PRINCIPAL ==================== -->
    <div class="table-wrap">
      <table id="habitTable">
        <!-- Cabeçalho e linhas gerados pelo JavaScript -->
      </table>
    </div>

    <!-- ==================== MENU DE CONFIGURAÇÕES (DROPDOWN) ==================== -->
    <div id="optionsPanel" class="dropdown-menu">
      <button id="exportBtn">📤 Exportar JSON</button>
      <label for="importFileInput" class="import-label">📥 Importar JSON</label>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>

    <!-- ==================== RODAPÉ ==================== -->
    <div class="footer">
      <div id="summary">--</div>
      <div class="save-status">Salvo localmente no navegador</div>
    </div>
  </div>

  <script src="habit-tracker.js" defer></script>
</body>
</html>
